name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip and HuggingFace
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: deps-${{ runner.os }}-py3.11

      - name: Install dependencies
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install transformers grpcio grpcio-tools numpy pytest

      - name: Generate proto stubs
        run: python scripts/gen_proto.py

      - name: Verify imports
        run: |
          python -c "import torch; print('torch', torch.__version__)"
          python -c "from src.stage import GPT2Stage; print('stage OK')"
          python -c "from src.serialize import encode, decode; print('serialize OK')"

      - name: Run tests
        run: python -m pytest tests/ -v --tb=long -s
